apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: vishal101090/payment-service:latest
          imagePullPolicy: Always
          env:
            - name: SERVER_PORT
              value: "5007"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: "http://discovery-service:5001/eureka/"
            - name: SPRING_DATA_MONGODB_URI
              value: "mongodb://mongodb-service:27017/payment_db"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-service:9092"
            - name: MANAGEMENT_ZIPKIN_TRACING_ENDPOINT
              value: "http://zipkin-service:9411/api/v2/spans"
          ports:
            - containerPort: 5007
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 5007
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 5007
            initialDelaySeconds: 40
            periodSeconds: 10

---

apiVersion: v1
kind: Service
metadata:
  name: payment-service
spec:
  selector:
    app: payment-service
  type: LoadBalancer
  ports:
    - protocol: TCP
      port: 5007
      targetPort: 5007

---

